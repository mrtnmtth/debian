name: Update repository

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-repo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The .deb files are not stored in git; only packages.txt and
          # urls.lock are tracked. The build re-downloads every package into
          # dl/ (cached) and rebuilds repo/ from those, and the result is
          # published via GitHub Pages.
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Install dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # Restore/save are split so the cache is saved with a key that reflects
      # the urls.lock produced by this run's build; the combined actions/cache
      # fixes the key at restore time, which would re-download a new direct
      # .deb (e.g. keybase, ~150 MB) once more on the following run.
      - name: Restore downloaded .deb cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('packages.txt', 'urls.lock') }}
          restore-keys: |
            dl-

      - name: Build repository
        run: make

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Package versions are pinned in packages.txt and urls.lock, so a
          # change to either is exactly when the built repo/ output changes.
          if [ -z "$(git status --porcelain packages.txt urls.lock)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          msg=$(scripts/commit-message.sh)
          git add packages.txt urls.lock
          git commit -m "$msg"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Deploy the freshly built apt repo straight from this workspace, which
      # holds the real .deb files produced by `make` — git only tracks
      # packages.txt, so the Pages deployment is the sole store of the built
      # repo. Only repo/ is published (apt URI is .../debian/repo/), which
      # also keeps dl/ and .git out of the Pages artifact. Runs only when
      # the repository actually changed, or on a manual dispatch.
      - name: Stage Pages content
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site/repo
          cp -a repo/. _site/repo/
          cp -a README.md _site/ 2>/dev/null || true

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4

      # hashFiles here sees the urls.lock updated by the build. Saving an
      # already-existing key (the no-change case) just logs a warning.
      - name: Save downloaded .deb cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('packages.txt', 'urls.lock') }}
